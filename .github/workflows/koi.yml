name: Koi

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: koi

      - name: Add legend
        shell: bash
        run: |
            convert -size 160x512 xc:none \
            -font DejaVu-Sans-Bold -pointsize 12 \
            -fill white -stroke black -strokewidth 1 \
            -gravity center \
            -annotate +0-90 "Color =" \
            -annotate +0-70 "top language" \
            -annotate +0+10 "Size =" \
            -annotate +0+30 "contributions" \
            -annotate +0+110 "Marks =" \
            -annotate +0+130 "streaks" \
            koi/legend.png
            convert koi/koi.gif koi/legend.png -append koi/koi_annotated.gif
            mv koi/koi_annotated.gif koi/koi.gif
            rm koi/legend.png

      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git stash
          git pull --rebase
          git stash pop || echo "No stash to pop"
          git add -A
          git commit -m "chore: koi draw" || exit 0
          git push   
